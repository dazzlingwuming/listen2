name: Build/release

on: push

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg --x64 --arm64 --universal
          - os: windows-latest
            args: --win nsis 7z --x64
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build and publish Electron release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx --no-install electron-builder ${{ matrix.args }} --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}

      - name: Verify unsigned Listen1 helper in macOS DMGs
        if: ${{ matrix.os == 'macos-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for arch in x64 arm64 universal; do
            image="dist/listen1_${version}_mac_${arch}.dmg"
            test -s "$image"
            mount_dir="$(mktemp -d "${RUNNER_TEMP}/listen1-${arch}-XXXXXX")"
            if ! hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount_dir" "$image" >/dev/null; then
              rmdir "$mount_dir"
              exit 1
            fi
            for file in 'Install Listen1.command' 'Listen1.integrity.tsv' 'INSTALL-LISTEN1.txt'; do
              if [[ ! -f "$mount_dir/$file" ]]; then
                hdiutil detach "$mount_dir" >/dev/null
                rmdir "$mount_dir"
                echo "Missing $file in $image" >&2
                exit 1
              fi
            done
            header="$(head -n 1 "$mount_dir/Listen1.integrity.tsv")"
            case "$arch:$header" in
              x64:$'LISTEN1-INTEGRITY-1\tcom.listen1.listen1\t'"$version"$'\tx86_64') ;;
              arm64:$'LISTEN1-INTEGRITY-1\tcom.listen1.listen1\t'"$version"$'\tarm64') ;;
              universal:$'LISTEN1-INTEGRITY-1\tcom.listen1.listen1\t'"$version"$'\tarm64 x86_64') ;;
              *)
                hdiutil detach "$mount_dir" >/dev/null
                rmdir "$mount_dir"
                echo "Invalid Listen1 integrity header in $image: $header" >&2
                exit 1
                ;;
            esac
            bash "$mount_dir/Install Listen1.command" --verify-only
            hdiutil detach "$mount_dir" >/dev/null
            rmdir "$mount_dir"
          done

  publish-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish completed release with notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Tag/version mismatch');
          const readme = fs.readFileSync('README.md', 'utf8');
          const heading = `## v${version} 更新`;
          const start = readme.indexOf(heading);
          if (start < 0) throw new Error('Release notes missing');
          const content = readme.slice(start + heading.length).split('\n## ')[0].trim();
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, content + '\n');
          NODE
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          node <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          const release = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release.json`));
          const assets = release.assets;
          const required = [
            `listen1_${version}_win_x64.exe`,
            `listen1_${version}_win_x64.7z`,
            `listen1_${version}_win_x64.exe.blockmap`,
            'latest.yml',
            'latest-mac.yml',
            ...['x64', 'arm64', 'universal'].flatMap(arch => [
              `listen1_${version}_mac_${arch}.dmg`,
              `listen1_${version}_mac_${arch}.dmg.blockmap`,
            ]),
          ];
          const assetsByName = new Map();
          for (const asset of assets) {
            if (asset.name === 'SHA256SUMS.txt') continue;
            if (!/^[A-Za-z0-9._-]+$/.test(asset.name)) {
              throw new Error(`Unsafe release asset name: ${JSON.stringify(asset.name)}`);
            }
            if (!Number.isSafeInteger(asset.size) || asset.size <= 0) {
              throw new Error(`Release asset is empty or has invalid size: ${asset.name}`);
            }
            if (typeof asset.digest !== 'string' || !/^sha256:[0-9a-f]{64}$/.test(asset.digest)) {
              throw new Error(`Missing or invalid GitHub SHA-256 digest: ${asset.name}`);
            }
            if (assetsByName.has(asset.name)) {
              throw new Error(`Duplicate release asset: ${asset.name}`);
            }
            assetsByName.set(asset.name, asset);
          }
          for (const name of required) {
            if (!assetsByName.has(name)) throw new Error(`Missing release asset: ${name}`);
          }
          const checksums = [...assetsByName.values()]
            .sort((a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0)
            .map(asset => `${asset.digest.slice('sha256:'.length)}  ${asset.name}`)
            .join('\n') + '\n';
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/SHA256SUMS.txt`, checksums);
          NODE
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
          gh release edit "$RELEASE_TAG" --title "Listen2 $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false
