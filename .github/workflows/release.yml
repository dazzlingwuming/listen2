name: Build/release

on: push

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg --x64 --arm64 --universal
          - os: windows-latest
            args: --win nsis 7z --x64
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build and publish Electron release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx --no-install electron-builder ${{ matrix.args }} --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ github.token }}

      - name: Verify plain drag-and-drop macOS DMGs
        if: ${{ matrix.os == 'macos-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          active_mount=""
          mounted=false
          cleanup_mount() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$active_mount" >/dev/null 2>&1 || true
              mounted=false
            fi
            if [[ -n "$active_mount" ]]; then
              rmdir "$active_mount" >/dev/null 2>&1 || true
              active_mount=""
            fi
          }
          trap cleanup_mount EXIT
          for arch in x64 arm64 universal; do
            image="dist/listen1_${version}_mac_${arch}.dmg"
            test -s "$image"
            mount_dir="$(mktemp -d "${RUNNER_TEMP}/listen1-${arch}-XXXXXX")"
            active_mount="$mount_dir"
            hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount_dir" "$image" >/dev/null
            mounted=true
            app="$mount_dir/Listen1.app"
            if [[ ! -d "$app" || -L "$app" ]]; then
              echo "Missing real Listen1.app in $image" >&2
              exit 1
            fi
            applications="$mount_dir/Applications"
            if [[ ! -L "$applications" || "$(readlink "$applications")" != "/Applications" ]]; then
              echo "Missing Applications link in $image" >&2
              exit 1
            fi
            for file in 'Install Listen1.command' 'Listen1.integrity.tsv' 'INSTALL-LISTEN1.txt'; do
              if [[ -e "$mount_dir/$file" || -L "$mount_dir/$file" ]]; then
                echo "Unexpected installation helper in plain DMG: $file" >&2
                exit 1
              fi
            done
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
            bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            if [[ "$bundle_id" != "com.listen1.listen1" || "$bundle_version" != "$version" || "$executable" != "Listen1" ]]; then
              echo "Unexpected bundle identity in $image: $bundle_id $bundle_version $executable" >&2
              exit 1
            fi
            actual_arch="$(lipo -archs "$app/Contents/MacOS/$executable" | tr ' ' '\n' | LC_ALL=C sort | paste -sd ' ' -)"
            case "$arch:$actual_arch" in
              x64:x86_64|arm64:arm64|universal:arm64\ x86_64) ;;
              *)
                echo "Unexpected architecture in $image: $actual_arch" >&2
                exit 1
                ;;
            esac
            hdiutil detach "$mount_dir" >/dev/null
            mounted=false
            rmdir "$mount_dir"
            active_mount=""
          done

  publish-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish completed release with notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Tag/version mismatch');
          const readme = fs.readFileSync('README.md', 'utf8');
          const heading = `## v${version} 更新`;
          const start = readme.indexOf(heading);
          if (start < 0) throw new Error('Release notes missing');
          const content = readme.slice(start + heading.length).split('\n## ')[0].trim();
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, content + '\n');
          NODE
          # BEGIN release ID lookup
          release_id="$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json databaseId --jq .databaseId)"
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid GitHub release ID returned for $RELEASE_TAG" >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/releases/$release_id" > "$RUNNER_TEMP/release.json"
          # END release ID lookup
          node <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          const release = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release.json`));
          const assets = release.assets;
          const required = [
            `listen1_${version}_win_x64.exe`,
            `listen1_${version}_win_x64.7z`,
            `listen1_${version}_win_x64.exe.blockmap`,
            'latest.yml',
            'latest-mac.yml',
            ...['x64', 'arm64', 'universal'].flatMap(arch => [
              `listen1_${version}_mac_${arch}.dmg`,
              `listen1_${version}_mac_${arch}.dmg.blockmap`,
            ]),
          ];
          const assetsByName = new Map();
          for (const asset of assets) {
            if (asset.name === 'SHA256SUMS.txt') continue;
            if (!/^[A-Za-z0-9._-]+$/.test(asset.name)) {
              throw new Error(`Unsafe release asset name: ${JSON.stringify(asset.name)}`);
            }
            if (!Number.isSafeInteger(asset.size) || asset.size <= 0) {
              throw new Error(`Release asset is empty or has invalid size: ${asset.name}`);
            }
            if (typeof asset.digest !== 'string' || !/^sha256:[0-9a-f]{64}$/.test(asset.digest)) {
              throw new Error(`Missing or invalid GitHub SHA-256 digest: ${asset.name}`);
            }
            if (assetsByName.has(asset.name)) {
              throw new Error(`Duplicate release asset: ${asset.name}`);
            }
            assetsByName.set(asset.name, asset);
          }
          for (const name of required) {
            if (!assetsByName.has(name)) throw new Error(`Missing release asset: ${name}`);
          }
          const checksums = [...assetsByName.values()]
            .sort((a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0)
            .map(asset => `${asset.digest.slice('sha256:'.length)}  ${asset.name}`)
            .join('\n') + '\n';
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/SHA256SUMS.txt`, checksums);
          NODE
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/SHA256SUMS.txt" --clobber
          gh release edit "$RELEASE_TAG" --title "Listen2 $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false
