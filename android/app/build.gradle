plugins {
    id 'com.android.application'
}

def media3Version = '1.9.4'
def roomVersion = '2.8.4'
def listen1SourceDirectory = file("${rootDir}/../app/listen1_chrome_extension")
def generatedAssetsDirectory = layout.buildDirectory.dir('generated/listen1-assets')

tasks.register('syncListen1Assets', Copy) {
    from(listen1SourceDirectory) {
        // This is deliberately an allow-list: extension metadata, developer
        // documentation, lockfiles, and tests are not packaged in the APK.
        include 'listen1.html'
        include 'annual_recap.html'
        include 'css/**'
        include 'fonts/**'
        include 'images/**'
        include 'i18n/*.json'
        include 'rules_1.json'
        include 'js/vendor/*.js'
        include 'js/provider/*.js'
        include 'js/controller/*.js'
        include 'js/app.js'
        include 'js/audio_visualizer.js'
        include 'js/bilibili_mv_player.js'
        include 'js/bilibili_qr.js'
        include 'js/bridge.js'
        include 'js/github.js'
        include 'js/l1_player.js'
        include 'js/lastfm.js'
        include 'js/loweb.js'
        include 'js/lowebutil.js'
        include 'js/myplaylist.js'
        include 'js/player_thread.js'
        include 'js/playlist_backup.js'
    }
    into(generatedAssetsDirectory.map { it.dir('listen1') })
    includeEmptyDirs = false
}

android {
    namespace 'com.dazzlingwuming.listen2'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dazzlingwuming.listen2'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2.34.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    'room.schemaLocation': "$projectDir/schemas",
                ]
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDir(generatedAssetsDirectory)
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'mergeDebugAssets' || task.name == 'mergeReleaseAssets'
            || task.name.toLowerCase().contains('lint')) {
        task.dependsOn(tasks.named('syncListen1Assets'))
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.room:room-runtime:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "androidx.room:room-testing:$roomVersion"
    // Android's framework JSONObject is a stub in JVM unit tests; keep the
    // production API unchanged while exercising the same JSON schemas locally.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
