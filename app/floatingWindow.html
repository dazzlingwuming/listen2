<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="listen1_chrome_extension/css/icon.css" rel="stylesheet" />
    <title>Listen1</title>
    <style>
      div.content {
        border-radius: 5px;
        min-height: 70px;
        box-sizing: border-box;
        overflow: hidden;
        text-align: center;
        font-size: 24px;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        transition: background ease-in-out 0.1s;
      }

      /* span.contentTrans {
        font-size: 18px;
      }
      body.unlocked-body:hover .content {
        background: rgba(36, 36, 36, 0.8);
      } */
      body {
        font-family: "SF Pro Text", "SF Pro Icons", "Helvetica Neue",
          "Microsoft Yahei", "Helvetica", "Arial", sans-serif;
        overflow: hidden;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      .feather {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: rgba(255, 255, 255, 0.72);
        stroke-width: 1.8;
        display: inline-block;
        pointer-events: none;
      }
      #toolbar {
        display: none;
        user-select: none;
        position: fixed;
        top: 4px;
        z-index: 9999;
        left: 0;
        right: 0;
        width: max-content;
        margin: 0 auto;
        padding: 4px 9px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(18, 20, 28, 0.82);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(14px) saturate(135%);
        text-align: center;
      }
      #toolbar .unlocked {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      #toolbar .locked {
        display: none;
        align-items: center;
        justify-content: center;
      }
      .icon {
        display: inline-flex;
        min-width: 18px;
        height: 20px;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
      }
      .icon:hover .feather {
        stroke: #ffffff;
      }
      .group-first-icon {
        margin-left: 5px;
      }
      #currentLyricAll {
        width: 100%;
        height: 100%;
      }
      body.window-locked #toolbar .unlocked {
        display: none;
      }
      body.window-locked #toolbar .locked {
        display: flex;
      }
      body.window-locked #toolbar {
        padding: 4px 7px;
        border-color: rgba(64, 224, 190, 0.32);
        background: rgba(14, 24, 27, 0.88);
        box-shadow: 0 6px 20px rgba(34, 211, 178, 0.12);
      }
      body.window-locked #unlock-icon {
        width: 24px;
        height: 20px;
      }
      body.window-locked #unlock-icon .feather {
        stroke: #45dfbd;
      }
    </style>
  </head>
  <body>
    <div
      style="visibility: hidden; position: absolute; width: 0px; height: 0px"
    >
      <!-- load feather icon svg sprite -->
      <svg xmlns="http://www.w3.org/2000/svg">
        <defs>
          <symbol id="lock" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </symbol>
          <symbol id="type" viewBox="0 0 24 24">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </symbol>
          <symbol id="plus" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </symbol>
          <symbol id="minus" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </symbol>
          <symbol id="sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </symbol>
          <symbol id="aperture" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="14.31" y1="8" x2="20.05" y2="17.94"></line>
            <line x1="9.69" y1="8" x2="21.17" y2="8"></line>
            <line x1="7.38" y1="12" x2="13.12" y2="2.06"></line>
            <line x1="9.69" y1="16" x2="3.95" y2="6.06"></line>
            <line x1="14.31" y1="16" x2="2.83" y2="16"></line>
            <line x1="16.62" y1="12" x2="10.88" y2="21.94"></line>
          </symbol>
        </defs>
      </svg>
    </div>
    <div id="currentLyricAll" class="content lyric-content">
      <span id="currentLyric" class="contentOriginal">Listen1</span>
      <span id="currentLyricTrans" class="contentTrans"></span>
    </div>
    <div id="toolbar">
      <div class="locked">
        <button
          type="button"
          class="icon window-action"
          id="unlock-icon"
          aria-label="解锁桌面歌词"
          title="桌面歌词已锁定，点击解锁"
        >
          <svg class="feather">
            <use href="#lock"></use>
          </svg>
        </button>
      </div>
      <div class="unlocked">
        <button
          type="button"
          class="icon window-action"
          id="lock-icon"
          aria-label="锁定桌面歌词"
          title="锁定桌面歌词"
        >
          <svg class="feather">
            <use href="#lock"></use>
          </svg>
        </button>
        <a
          class="icon control-action group-first-icon"
          id="font-small-icon"
          title="减小字号"
          data-msg="float_window_font_small"
        >
          <svg class="feather">
            <use href="#type"></use>
          </svg>
          <svg class="feather" style="margin-left: -10px">
            <use href="#minus"></use>
          </svg>
        </a>
        <a
          class="icon control-action"
          id="font-large-icon"
          title="增大字号"
          data-msg="float_window_font_large"
        >
          <svg class="feather">
            <use href="#type"></use>
          </svg>
          <svg class="feather icon" style="margin-left: -10px">
            <use href="#plus"></use>
          </svg>
        </a>
        <a
          class="icon control-action group-first-icon"
          title="降低背景不透明度"
          data-msg="float_window_background_dark"
        >
          <svg class="feather">
            <use href="#sun"></use>
          </svg>
          <svg class="feather icon" style="margin-left: -10px">
            <use href="#minus"></use>
          </svg>
        </a>
        <a
          class="icon control-action"
          title="提高背景不透明度"
          data-msg="float_window_background_light"
        >
          <svg class="feather">
            <use href="#sun"></use>
          </svg>
          <svg class="feather icon" style="margin-left: -10px">
            <use href="#plus"></use>
          </svg>
        </a>
        <a
          class="icon control-action group-first-icon"
          title="切换歌词颜色"
          data-msg="float_window_font_change_color"
        >
          <svg class="feather">
            <use href="#aperture"></use>
          </svg>
        </a>
      </div>
    </div>
    <script>
      currentLyric = document.getElementById("currentLyric");
      window.api.onLyric((arg) => {
        currentLyric.innerHTML = arg;
      });
      currentLyricTrans = document.getElementById("currentLyricTrans");
      window.api.onTranslLyric((arg) => {
        currentLyricTrans.innerHTML = arg;
      });
    </script>
    <script>
      let IS_WINDOW_LOCKED = false;
      const toolbar = document.getElementById("toolbar");
      const unlockIcon = document.getElementById("unlock-icon");

      function renderToolBar() {
        document.body.classList.toggle("window-locked", IS_WINDOW_LOCKED);
        if (IS_WINDOW_LOCKED) {
          // Keep only the unlock affordance visible while the pointer is still
          // inside the lyric strip. All editing controls are hidden by CSS.
          toolbar.style.display = "block";
        }
      }

      document.addEventListener("mouseenter", () => {
        toolbar.style.display = "block";
      });
      document.addEventListener("mouseleave", () => {
        toolbar.style.display = "none";
        if (IS_WINDOW_LOCKED) {
          window.api.send("control", "float_window_ignore_mouse_event");
        }
      });

      // Electron can only make the whole native window click-through. While
      // locked, forwarded mouse movement lets this one small button temporarily
      // receive a click; leaving it restores click-through immediately.
      unlockIcon.addEventListener("mouseenter", () => {
        if (IS_WINDOW_LOCKED) {
          window.api.send("control", "float_window_accept_mouse_event");
        }
      });
      unlockIcon.addEventListener("mouseleave", () => {
        if (IS_WINDOW_LOCKED) {
          window.api.send("control", "float_window_ignore_mouse_event");
        }
      });

      Array.from(document.getElementsByClassName("window-action")).forEach(
        (elem) => {
          elem.addEventListener(
            "click",
            function () {
              // toggle floating window lock/unlock status
              IS_WINDOW_LOCKED = !IS_WINDOW_LOCKED;
              renderToolBar();
              const message = IS_WINDOW_LOCKED
                ? "float_window_ignore_mouse_event"
                : "float_window_accept_mouse_event";
              window.api.send("control", message);
            },
            false
          );
        }
      );

      Array.from(document.getElementsByClassName("control-action")).forEach(
        (elem) => {
          elem.addEventListener("click", (event) => {
            const message = event.currentTarget.dataset.msg;
            window.api.send("control", message);
          });
        }
      );
      // drag can't use webkit-app-region becse mouse enter will not trigger
      // we use custom handle, more details please read link below
      // https://github.com/electron/electron/issues/1354#issuecomment-404348957
      let animationId;
      let mouseX;
      let mouseY;

      function onMouseDown(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;

        document.addEventListener("mouseup", onMouseUp);
        animationId = requestAnimationFrame(moveWindow);
      }

      function onMouseUp() {
        document.removeEventListener("mouseup", onMouseUp);
        cancelAnimationFrame(animationId);
      }

      function moveWindow() {
        window.api.send("floatWindowMoving", {
          mouseX,
          mouseY,
        });
        animationId = requestAnimationFrame(moveWindow);
      }

      document
        .getElementById("currentLyricAll")
        .addEventListener("mousedown", (event) => {
          onMouseDown(event);
        });

      renderToolBar();
    </script>
  </body>
</html>
